name: Java CI with Maven

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install Paper server (Mojang-mapped)
        run: ./scripts/install-paper-server.sh 1.21.4
      - name: Build
        run: mvn -B package
      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: VanillaMinimaps
          path: target/vanillaminimaps-*.jar
